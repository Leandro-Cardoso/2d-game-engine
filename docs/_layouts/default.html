<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Engine Doc</title>

    <link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/header.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/search.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/sidebar.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/footer.css' | relative_url }}">
</head>
<body>

    <!-- Header -->
    {% include header.html %}

    <!-- Search -->
    {% include search.html %}

    <!-- Main Section -->
    <section class="main-section">

        <!-- Sidebar -->
        {% include sidebar.html %}

        <!-- Main -->
        <main class="content">

            <!-- Title -->
            {% if page.category %}
                <h1>{{ page.category }}</h1>
                <h2>{{ page.title }}</h2>
            {% else %}
                <h1>{{ page.title }}</h1>
            {% endif %}

            <!-- Content -->
            {{ content }}

        </main>

    </section>

    <!-- Footer -->
    {% include footer.html %}

    <script src="{{ '/assets/js/toggles.js' | relative_url }}"></script>
    
</body>
</html>
